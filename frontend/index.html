<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EcoTrack - Tu compañero para un estilo de vida sostenible" />
  
  <!-- DNS prefetch para APIs externas -->
  <link rel="dns-prefetch" href="https://supabase.co" />
  
  <!-- CSS crítico inline para evitar pantalla blanca -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7fafc;
    }
    #root { min-height: 100vh; }
    
    /* Loading skeleton inicial */
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .loader-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #38A169 0%, #2F855A 100%);
      border-radius: 20px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-text {
      color: #2D3748;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .loader-subtitle {
      color: #718096;
      font-size: 14px;
    }
    .loader-bar {
      width: 200px;
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }
    .loader-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #38A169;
      border-radius: 2px;
      animation: loading 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
  
  <title>EcoTrack</title>
</head>

<body>
  <div id="root">
    <!-- Fallback HTML mientras carga React -->
    <div class="initial-loader">
      <div class="loader-logo"></div>
      <div class="loader-text">EcoTrack</div>
      <div class="loader-subtitle">Cargando tu experiencia eco...</div>
      <div class="loader-bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
